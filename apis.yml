aid: homeaway
name: HomeAway *
description: >-
  HomeAway was an Austin, Texas vacation-rental marketplace that connected travelers with owners and
  property managers of holiday homes, cabins, condos, and beach houses worldwide. It published a
  first-party HomeAway API (OAuth 2.0) for listing management, availability and booking synchronization,
  pricing, and guest communication, along with a Ruby SDK and the hacurl command-line tool from its
  GitHub organization. HomeAway was acquired by Expedia Group in 2015 and the brand was retired into
  Vrbo: homeaway.com now redirects to Vrbo and the developer platform is no longer maintained. This
  profile captures the genuine historical first-party API surface (SDK, CLI, OAuth auth model) that
  remains publicly available.
